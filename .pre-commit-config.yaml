repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -m "not integration"
        language: system
        pass_filenames: false

    
  - repo: local
    hooks:
      - id: uv-lock
        name: Check uv lockfile
        entry: uv lock --check
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false