[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dojozero-agent-runner"
version = "0.1.0"
description = "Single-image runner for externalized DojoZero agents (canary + farm workers)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "DojoZero Team", email = "dojozero@list.alibaba-inc.com"}
]
keywords = ["ai-agents", "sports", "realtime", "prediction", "runner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "dojozero-client>=0.3.0",
    "aip-identity-sdk>=0.1.7",
    "agentscope>=1.0.14",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/agentscope-ai/DojoZero"
Repository = "https://github.com/agentscope-ai/DojoZero"
Issues = "https://github.com/agentscope-ai/DojoZero/issues"

[project.scripts]
dojozero-agent-runner = "dojozero_agent_runner.__main__:main"
