scenario:
  name: nba
  config:
    espn_game_id: '401869368'  # ESPN game ID for the NBA game
    hub:
      persistence_file: outputs/nba_betting_events-{espn_game_id}.jsonl

    data_streams:
    - id: pre_game_insights_stream
      event_types:
      - injury_report
      - power_ranking
      - expert_prediction
      - pregame_stats
      - twitter_top_tweets
      
    # Game lifecycle
    - id: game_lifecycle_stream
      event_types:
      - game_initialize
      - game_start
      - game_result

    # Live game data
    - id: game_update_stream
      event_types:
      - nba_game_update

    - id: odds_update_stream
      event_types:
      - odds_update

    - id: play_by_play_stream
      event_types:
      - nba_play

    operators:                                               
    - id: betting_broker                                     
      class: BrokerOperator                                  
      initial_balance: "1000.00"                             
      scoring_system: "ScoringSys3"  # Quarter pool strategy with unlimited entry                                         
      # max_predictions: null (unlimited by default)         
      quarter_pools: [4000, 3000, 2000, 1000]  # Prize pools for each quarter                                             
      allowed_tools:                                  
      - get_event                                            
      - submit_prediction
      - get_my_predictions 
      - get_statistics                                    
      data_streams:                                          
      - game_lifecycle_stream                                
      - odds_update_stream                                   
      - game_update_stream       

    agents:
    - id: degen_agent
      persona: degen
      class: BettingAgent
      persona_config_path: agents/personas/degen.yaml
      llm_config_path: agents/llms/qwen.yaml
      operators:
      - betting_broker
      data_streams:
      - pre_game_insights_stream
      - game_update_stream
      - odds_update_stream
      - game_lifecycle_stream
      - play_by_play_stream
    - id: mystic_agent
      persona: mystic
      class: BettingAgent
      persona_config_path: agents/personas/mystic.yaml
      llm_config_path: agents/llms/qwen.yaml
      operators:
        - betting_broker
      data_streams:
        - pre_game_insights_stream
        - game_update_stream
        - odds_update_stream
        - game_lifecycle_stream
        - play_by_play_stream
    - id: pundit_agent
      persona: pundit
      class: BettingAgent
      persona_config_path: agents/personas/pundit.yaml
      llm_config_path: agents/llms/qwen.yaml
      operators:
        - betting_broker
      data_streams:
        - pre_game_insights_stream
        - game_update_stream
        - odds_update_stream
        - game_lifecycle_stream
        - play_by_play_stream
    - id: shark_agent
      persona: shark
      class: BettingAgent
      persona_config_path: agents/personas/shark.yaml
      llm_config_path: agents/llms/qwen.yaml
      operators:
      - betting_broker
      data_streams:
      - pre_game_insights_stream
      - game_update_stream
      - odds_update_stream
      - game_lifecycle_stream
      - play_by_play_stream
    - id: sheep_agent
      persona: sheep
      class: BettingAgent
      persona_config_path: agents/personas/sheep.yaml
      llm_config_path: agents/llms/qwen.yaml
      operators:
      - betting_broker
      data_streams:
      - pre_game_insights_stream
      - game_update_stream
      - odds_update_stream
      - game_lifecycle_stream
      - play_by_play_stream
    - id: whale_agent
      persona: whale
      class: BettingAgent
      persona_config_path: agents/personas/whale.yaml
      llm_config_path: agents/llms/qwen.yaml
      operators:
      - betting_broker
      data_streams:
      - pre_game_insights_stream
      - game_update_stream
      - odds_update_stream
      - game_lifecycle_stream
      - play_by_play_stream
