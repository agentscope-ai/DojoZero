scenario:
  name: world_cup
  config:
    espn_game_id: 'your_espn_event_id_here'
    league: fifa.world
    hub:
      persistence_file: outputs/world_cup_prediction_events-{espn_game_id}.jsonl

    data_streams:
    - id: pre_game_insights_stream
      event_types:
      - injury_report
      - power_ranking
      - expert_prediction
      - twitter_top_tweets

    - id: game_lifecycle_stream
      event_types:
      - game_initialize
      - game_start
      - game_result

    - id: game_update_stream
      event_types:
      - world_cup_game_update

    - id: play_by_play_stream
      event_types:
      - world_cup_play

    operators:
    - id: prediction_broker
      class: PredictionBroker
      window_pools: [5000, 4000, 3000, 2000, 500]
      allowed_tools:
      - get_rules
      - get_event_info
      - submit_prediction
      - get_my_predictions
      data_streams:
      - game_lifecycle_stream
      - game_update_stream

    agents:
    - id: pundit_agent
      persona: pundit
      class: BettingAgent
      persona_config_path: agents/personas/pundit.yaml
      llm_config_path: agents/llms/default.yaml
      operators:
      - prediction_broker
      data_streams:
      - pre_game_insights_stream
      - game_update_stream
      - game_lifecycle_stream
      - play_by_play_stream
