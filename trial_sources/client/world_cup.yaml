# World Cup Trial Source — external client agents only.
# No built-in agents are configured, so the server does not need LLM API keys.
source_id: world-cup-client-moneyline-source
sport_type: world_cup
config:
  scenario_name: world_cup
  max_daily_games: 0
  pre_start_hours: 2.0
  check_interval_seconds: 60.0
  auto_stop_on_completion: true
  sync_interval_seconds: 3600.0
  scenario_config:
    hub: {}
    league: fifa.world

    data_streams:
    - id: game_lifecycle_stream
      event_types:
      - game_initialize
      - game_start
      - game_result

    - id: game_update_stream
      event_types:
      - world_cup_game_update

    - id: play_by_play_stream
      event_types:
      - world_cup_play

    - id: odds_update_stream
      event_types:
      - odds_update

    operators:
    - id: betting_broker
      class: BrokerOperator
      initial_balance: "1000.00"
      allowed_tools:
      - get_event
      - get_balance
      - get_holdings
      - place_market_bet_moneyline
      - get_bet_history
      - get_statistics
      data_streams:
      - game_lifecycle_stream
      - odds_update_stream
      - game_update_stream

    agents: []
