# World Cup Prediction Trial Source — external client agents only.
# No built-in agents are configured, so the server does not need LLM API keys.
source_id: world-cup-client-prediction-source
sport_type: world_cup
config:
  scenario_name: world_cup
  max_daily_games: 0
  pre_start_hours: 2.0
  check_interval_seconds: 60.0
  auto_stop_on_completion: true
  sync_interval_seconds: 3600.0
  scenario_config:
    hub: {}
    league: fifa.world

    data_streams:
    - id: game_lifecycle_stream
      event_types:
      - game_initialize
      - game_start
      - game_result

    - id: game_update_stream
      event_types:
      - world_cup_game_update

    - id: play_by_play_stream
      event_types:
      - world_cup_play

    operators:
    - id: prediction_broker
      class: PredictionBroker
      window_pools: [5000, 4000, 3000, 2000, 500]
      allowed_tools:
      - get_rules
      - get_event_info
      - submit_prediction
      - get_my_predictions
      data_streams:
      - game_lifecycle_stream
      - game_update_stream

    agents: []
