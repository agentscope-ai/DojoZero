# World Cup Prediction Trial Source — Production environment
source_id: world-cup-prediction-source
sport_type: world_cup
config:
  scenario_name: world_cup
  max_daily_games: 0
  pre_start_hours: 2.0
  check_interval_seconds: 60.0
  auto_stop_on_completion: true
  sync_interval_seconds: 3600.0
  scenario_config:
    hub: {}
    league: fifa.world

    data_streams:
    - id: pre_game_insights_stream
      event_types:
      - injury_report
      - power_ranking
      - expert_prediction
      - twitter_top_tweets

    - id: game_lifecycle_stream
      event_types:
      - game_initialize
      - game_start
      - game_result

    - id: game_update_stream
      event_types:
      - world_cup_game_update

    - id: play_by_play_stream
      event_types:
      - world_cup_play

    operators:
    - id: prediction_broker
      class: PredictionBroker
      window_pools: [5000, 4000, 3000, 2000, 500]
      allowed_tools:
      - get_rules
      - get_event_info
      - submit_prediction
      - get_my_predictions
      data_streams:
      - game_lifecycle_stream
      - game_update_stream

    agents:
    - id: degen_agent
      persona: degen
      class: BettingAgent
      persona_config_path: agents/personas/degen.yaml
      llm_config_path: agents/llms/default.yaml
      operators: [prediction_broker]
      data_streams:
      - pre_game_insights_stream
      - game_update_stream
      - game_lifecycle_stream
      - play_by_play_stream
    - id: mystic_agent
      persona: mystic
      class: BettingAgent
      persona_config_path: agents/personas/mystic.yaml
      llm_config_path: agents/llms/default.yaml
      operators: [prediction_broker]
      data_streams:
      - pre_game_insights_stream
      - game_update_stream
      - game_lifecycle_stream
      - play_by_play_stream
    - id: pundit_agent
      persona: pundit
      class: BettingAgent
      persona_config_path: agents/personas/pundit.yaml
      llm_config_path: agents/llms/default.yaml
      operators: [prediction_broker]
      data_streams:
      - pre_game_insights_stream
      - game_update_stream
      - game_lifecycle_stream
      - play_by_play_stream
    - id: shark_agent
      persona: shark
      class: BettingAgent
      persona_config_path: agents/personas/shark.yaml
      llm_config_path: agents/llms/default.yaml
      operators: [prediction_broker]
      data_streams:
      - pre_game_insights_stream
      - game_update_stream
      - game_lifecycle_stream
      - play_by_play_stream
    - id: sheep_agent
      persona: sheep
      class: BettingAgent
      persona_config_path: agents/personas/sheep.yaml
      llm_config_path: agents/llms/default.yaml
      operators: [prediction_broker]
      data_streams:
      - pre_game_insights_stream
      - game_update_stream
      - game_lifecycle_stream
      - play_by_play_stream
    - id: whale_agent
      persona: whale
      class: BettingAgent
      persona_config_path: agents/personas/whale.yaml
      llm_config_path: agents/llms/default.yaml
      operators: [prediction_broker]
      data_streams:
      - pre_game_insights_stream
      - game_update_stream
      - game_lifecycle_stream
      - play_by_play_stream
